[tool.ruff]
line-length = 100
target-version = "py310"
# Only lint/format your own code, not vendored subprojects
extend-exclude = ["BenchMARL/test", "BenchMARL/examples", "PowerGridworld/examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # Let formatter handle line length

[tool.ruff.format]
quote-style = "double"
