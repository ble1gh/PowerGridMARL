defaults:
  - hgteamhappo_config
  - _self_

# PPO base parameters
share_param_critic: True
clip_epsilon: 0.2
entropy_coef: 0.01
critic_coef: 2.0
loss_critic_type: "smooth_l1"
lmbda: 0.95
scale_mapping: "biased_softplus_1.0"
scale_lb: 0.0001
use_tanh_normal: False
minibatch_advantage: True
use_beta: True
beta_min_param: 1.

# HGTeam-specific parameters
share_critic_across_groups: True
centralised_value_per_agent: True
critic_embed_dim: 32
gnn_mode: "learned_query"  # Options: "none", "concat", "hypernetwork", "learned_query"
actor_graph_mode: "shared"  # Options: "shared" (PowerGrid-style), "ego_entity" (per-agent ego graphs)
ego_gnn_topology: "star"    # Options: "star" (self-node hub), "full" (all-to-all entity edges)
heterognn_type: "heterognn" # Options: "heterognn", "edgeweightedhgt", "edgebiasedhgt"
z_dim: 32
hypernet_actor_feature_dim: 64
stochastic_z: True
embedding_entropy_coef: 0.0
embedding_diversity_coef: 0.0

# GNN configuration parameters
gnn_num_layers: 2
gnn_heads: 2
gnn_concat_heads: False
gnn_use_beta: True
gnn_self_loops: True
gnn_agent_node_feature_key: "participation_score"
gnn_agent_node_feature_dim: 1
gnn_norm_class: null  # Options: null, "LayerNorm", "BatchNorm1d", "InstanceNorm1d", "GroupNorm"
critic_use_other_actions: True  # Condition value function on other agents' actions (counterfactual)

# Split-z: separate GNN output into z_token (KV) and z_query (cross-attn query)
split_z: False
z_token_dim: 32
z_query_dim: 32
stochastic_z_query: False

# VIB (Variational Information Bottleneck)
use_vib: False
vib_beta: 0.0001
vib_warmup_frames: 500000

# Advantage normalization (slow-EMA reference scale)
# When True, advantages are normalized against a per-group slow-EMA reference
# std (running-mean seeded for the first adv_norm_ema_warmup_iters updates,
# then EMA with decay adv_norm_ema_decay) instead of per-batch unit-variance
# normalization, so the effective PPO step decays as the advantage signal
# vanishes. False = legacy per-slot per-batch (S8a) normalization.
adv_norm_ema: True
adv_norm_ema_decay: 0.999
adv_norm_ema_warmup_iters: 10

# Encoder freeze schedule (T3 frozen-encoder ablation).
# null = never freeze (default). 0 = freeze the shared actor GNN from init
# (fixed random feature map; heads/critics still train). N = train the encoder
# until total_frames >= N, then freeze.
encoder_freeze_after_frames: null

# HAPPO-specific parameters
encoder_update_mode: "separate_forward"  # Options: "accumulated", "separate_forward", "coop_encoder"
fixed_order: False                  # Random group ordering each epoch (True = fixed order)
encoder_n_optimizer_steps: null     # Phase 2 GNN optimizer steps (null = use n_minibatch_iters)
encoder_lr: null                    # Phase 2 GNN learning rate (null = use experiment lr)
