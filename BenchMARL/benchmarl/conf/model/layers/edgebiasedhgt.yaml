name: edgebiasedhgt

# Generic smoke-test-safe defaults. VPP/PowerGridworld configs should override
# grid_edge_keys, edge_features_dims, agent_node_index_key, and node_features_*.
topology: full
self_loops: True

cat_observations_to_output: False

position_key: null
pos_features: 0
velocity_key: null
vel_features: 0
exclude_pos_from_node_features: null
edge_radius: null

edge_features_key: null
agent_node_index_key: null

agent_groups: null
node_types: null
node_features_keys: null
edge_types: null
node_features_dims: null
edge_features_dims:
  interaction: 0
grid_edge_keys: null
exclude_observations_from_node_features: False
prune_non_agent_final_layer: False
gnn_hidden_dim: null
num_layers: 1

activation_class: torch.nn.ReLU
activation_kwargs: null
norm_class: null
norm_kwargs: null

heads: 1
zero_init_edge_projections: True
allow_missing_edge_features: False
dropout: 0.0
